<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>毕业启航指南 · 新锐生存百科</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-900: #0b3b3b;
    --teal-800: #0f4c4c;
    --teal-700: #14746f;
    --teal-500: #14b8a6;
    --teal-300: #5eead4;
    --bg: #eef6f5;
    --card: #ffffff;
    --text: #10302f;
    --muted: #6b8583;
    --border: #d9e8e6;
    --accent: #14b8a6;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 26px;
    background: linear-gradient(120deg, #0b3b3b, #14746f 55%, #0f766e);
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 18px rgba(11, 59, 59, .28);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,.15);
    display: grid; place-items: center;
    font-size: 20px;
    border: 1px solid rgba(255,255,255,.2);
  }
  .brand h1 { font-size: 17px; letter-spacing: .5px; font-weight: 700; }
  .brand p { font-size: 11px; opacity: .68; margin-top: 2px; letter-spacing: .3px; }

  .search {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
    padding: 0 14px;
    width: min(470px, 46vw);
    transition: .2s;
  }
  .search:focus-within {
    background: rgba(255,255,255,.22);
    border-color: var(--teal-300);
    box-shadow: 0 0 0 3px rgba(94,234,212,.18);
  }
  .search-icon { font-size: 13px; opacity: .8; }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; padding: 10px 8px; font-size: 13px;
    font-family: inherit;
  }
  .search input::placeholder { color: rgba(255,255,255,.58); }
  .clear-btn {
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 11px; cursor: pointer; line-height: 1;
    display: grid; place-items: center; transition: .15s;
  }
  .clear-btn:hover { background: rgba(255,255,255,.38); }

  /* ============ 布局 ============ */
  .layout { flex: 1; display: flex; overflow: hidden; }

  .sidebar {
    width: 236px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .side-label {
    font-size: 11px; color: #9bb3b1; letter-spacing: 1.5px;
    padding: 4px 12px 8px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: #375757;
    border-left: 3px solid transparent;
    transition: background .16s, color .16s, border-color .16s;
    user-select: none;
  }
  .nav-item:hover { background: #f0f8f7; }
  .nav-item.active {
    background: #e6f6f4;
    color: #0b3b3b;
    font-weight: 600;
    border-left-color: var(--accent);
  }
  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-item .nav-count {
    margin-left: auto; font-size: 11px; color: #9bb3b1;
    background: #f2f7f7; padding: 1px 7px; border-radius: 999px;
  }
  .nav-item.active .nav-count { background: #fff; color: var(--accent); }

  .random-btn {
    margin-top: auto;
    padding: 11px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: #fbfefd;
    color: var(--muted);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: .18s;
  }
  .random-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #f0fbf9;
  }

  /* ============ 内容区 ============ */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 34px 70px;
    scroll-behavior: smooth;
  }

  .board-head { margin-bottom: 24px; }
  .board-head h2 {
    font-size: 25px; letter-spacing: .4px;
    display: flex; align-items: center; gap: 10px;
  }
  .board-head > p {
    color: var(--muted); margin-top: 8px; font-size: 13.5px; line-height: 1.6;
  }
  .board-stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .stat-pill {
    font-size: 12px; padding: 4px 13px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border); color: var(--muted);
  }
  .stat-pill.accent { color: var(--accent); border-color: var(--accent); background: #f0fbf9; }

  .group {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(16,48,47,.04);
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .group-head { display: flex; align-items: center; gap: 10px; }
  .group-head .g-icon { font-size: 18px; }
  .group-head h3 { font-size: 16.5px; letter-spacing: .3px; }
  .group-intro {
    font-size: 12.5px; color: var(--muted);
    margin-top: 7px; line-height: 1.6;
  }

  .sub-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--accent); font-weight: 700;
    margin: 18px 0 10px; letter-spacing: .5px;
  }
  .sub-title::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }

  .item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 15px 14px;
    cursor: pointer;
    background: #fbfefd;
    transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
  }
  .item:hover {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 6px 18px rgba(20,184,166,.13);
    transform: translateY(-2px);
  }
  .item-name {
    font-size: 13.8px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .item-name::after {
    content: '▾';
    margin-left: auto;
    font-size: 10px;
    color: #b8cccb;
    transition: transform .2s;
  }
  .item.open .item-name::after { transform: rotate(180deg); }
  .item-desc {
    font-size: 12.5px; color: var(--muted); line-height: 1.72;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item.open .item-desc { -webkit-line-clamp: unset; }

  .item.flash {
    animation: flash 1.6s ease;
  }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(20,184,166,0); }
    25%      { box-shadow: 0 0 0 5px rgba(20,184,166,.3); }
    60%      { box-shadow: 0 0 0 5px rgba(20,184,166,.15); }
  }

  /* ============ 搜索结果 ============ */
  .result-list { display: flex; flex-direction: column; gap: 12px; }
  .result {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    cursor: pointer;
    transition: .18s;
  }
  .result:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(20,184,166,.12);
    transform: translateX(3px);
  }
  .result-path {
    font-size: 11.5px; color: #9bb3b1; letter-spacing: .4px;
    margin-bottom: 7px;
  }
  .result-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .result-desc { font-size: 12.8px; color: var(--muted); line-height: 1.7; }

  mark {
    background: #fff3b0;
    color: #7a5c00;
    border-radius: 3px;
    padding: 0 2px;
    font-weight: 700;
  }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty .big { font-size: 42px; margin-bottom: 14px; }
  .empty p { font-size: 13.5px; line-height: 1.9; }

  /* ============ 滚动条 ============ */
  .content::-webkit-scrollbar,
  .sidebar::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb,
  .sidebar::-webkit-scrollbar-thumb {
    background: #cfe2e0; border-radius: 8px;
  }
  .content::-webkit-scrollbar-thumb:hover { background: #b3d0cd; }
  .content::-webkit-scrollbar-track,
  .sidebar::-webkit-scrollbar-track { background: transparent; }

  /* ============ 响应式 ============ */
  @media (max-width: 880px) {
    .topbar {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 12px 16px;
    }
    .brand p { display: none; }
    .search { width: 100%; margin-left: 0; }

    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px;
      border-right: none;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .side-label { display: none; }
    .nav-item {
      white-space: nowrap;
      border-left: none;
      border-bottom: 3px solid transparent;
      border-radius: 8px;
      padding: 9px 14px;
    }
    .nav-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    .nav-item .nav-count { display: none; }
    .random-btn { display: none; }

    .content { padding: 18px 16px 60px; }
    .item-grid { grid-template-columns: 1fr; }
    .board-head h2 { font-size: 21px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🎓</div>
    <div>
      <h1>毕业启航指南</h1>
      <p>新锐生存百科 · 刚毕业大学生的第一本数字百科全书</p>
    </div>
  </div>
  <div class="search">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="text"
           placeholder="搜索「三方协议」「租房避坑」「社保公积金」…（按 / 聚焦）">
    <button id="clearBtn" class="clear-btn" hidden>✕</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-label">百科类目</div>
    <nav id="navList"></nav>
    <button id="randomBtn" class="random-btn">🎲 随机翻一条词条</button>
  </aside>
  <main class="content" id="content"></main>
</div>

            { name: '行业报告与数据', desc: '去哪里找免费的行业研究报告、数据源与趋势分析工具。' },
            { name: '职场软技能', desc: '沟通表达、Excel、PPT、时间管理等通用能力的提升路径。' }
          ]}
        ]
      }
    ]
  },
  {
    id: 'bar',
    name: '电子酒吧',
    icon: '🍻',
    color: '#f59e0b',
    tagline: '白天好好做人，晚上往死里蹦。',
    groups: [
      {
        name: '往死里问', icon: '❓',
        intro: '匿名提问区，问什么都可以。',
        subs: [
          { name: null, items: [
            { name: '职场吐槽', desc: '领导画饼、同事甩锅、加班无底线——说出来会好受一点。' },
            { name: '生活求助', desc: '租房纠纷、情感困惑、人际关系，总有人经历过你正在经历的。' }
          ]}
        ]
      },
      {
        name: '往死里蹦', icon: '🎉',
        intro: '周末别一个人待着。',
        subs: [
          { name: null, items: [
            { name: '解压小游戏', desc: '几分钟就能玩一局，专治下班后的精神内耗。' },
            { name: '同城搭子', desc: '找饭搭子、运动搭子、看展搭子，把周末填满。' }
          ]}
        ]
      }
    ]
  }
];

/* =========================================================
   构建全局索引（用于搜索 / 随机）
   ========================================================= */
const INDEX = [];
WIKI.forEach(board => {
  board.groups.forEach(group => {
    group.subs.forEach(sub => {
      sub.items.forEach(item => {
        INDEX.push({
          boardId: board.id,
          boardName: board.name,
          groupName: group.name,
          subName: sub.name,
          item,
          key: [board.id, group.name, sub.name || '', item.name].join('¦'),
          path: [board.name, group.name, sub.name].filter(Boolean).join(' / ')
        });
      });
    });
  });
});

/* =========================================================
   DOM & 工具
   ========================================================= */
const navList    = document.getElementById('navList');
const content    = document.getElementById('content');
const searchInput= document.getElementById('searchInput');
const clearBtn   = document.getElementById('clearBtn');
const randomBtn  = document.getElementById('randomBtn');

let currentBoardId = WIKI[0].id;

const getBoard = id => WIKI.find(b => b.id === id);

function countItems(board) {
  let n = 0;
  board.groups.forEach(g => g.subs.forEach(s => { n += s.items.length; }));
  return n;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function hl(text, kw) {
  const safe = esc(text);
  if (!kw) return safe;
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

/* =========================================================
   渲染：左侧导航
   ========================================================= */
function renderNav() {
  navList.innerHTML = WIKI.map(b => `
    <div class="nav-item ${b.id === currentBoardId ? 'active' : ''}" data-id="${b.id}">
      <span class="nav-icon">${b.icon}</span>
      <span>${b.name}</span>
      <span class="nav-count">${countItems(b)}</span>
    </div>
  `).join('');
}

navList.addEventListener('click', e => {
  const el = e.target.closest('.nav-item');
  if (!el) return;
  clearSearch();
  goto(el.dataset.id);
});

/* =========================================================
   渲染：板块内容
   ========================================================= */
function renderBoard(board) {
  document.documentElement.style.setProperty('--accent', board.color);

  let html = `
    <div class="board-head">
      <h2><span>${board.icon}</span>${esc(board.name)}</h2>
      <p>${esc(board.tagline)}</p>
      <div class="board-stats">
        <span class="stat-pill accent">${board.groups.length} 个类目</span>
        <span class="stat-pill">${countItems(board)} 条百科词条</span>
      </div>
    </div>
  `;

  board.groups.forEach((group, gi) => {
    html += `
      <section class="group" style="animation-delay:${Math.min(gi * 45, 260)}ms">
        <div class="group-head">
          <span class="g-icon">${group.icon || '📌'}</span>
          <h3>${esc(group.name)}</h3>
        </div>
        ${group.intro ? `<p class="group-intro">${esc(group.intro)}</p>` : ''}
    `;

    group.subs.forEach(sub => {
      html += sub.name ? `<div class="sub-title">${esc(sub.name)}</div>` : '';
      html += `<div class="item-grid">`;
      sub.items.forEach(item => {
        const key = [board.id, group.name, sub.name || '', item.name].join('¦');
        html += `
          <div class="item" data-key="${esc(key)}">
            <div class="item-name">${esc(item.name)}</div>
            <div class="item-desc">${esc(item.desc)}</div>
          </div>
        `;
      });
      html += `</div>`;
    });

    html += `</section>`;
  });

  content.innerHTML = html;
  content.scrollTop = 0;
}

/* =========================================================
   页面跳转（含定位高亮）
   ========================================================= */
function goto(boardId, key) {
  currentBoardId = boardId;
  renderNav();
  renderBoard(getBoard(boardId));

  if (!key) return;
  requestAnimationFrame(() => {
    const items = content.querySelectorAll('.item');
    for (const el of items) {
      if (el.dataset.key === key) {
        el.classList.add('open', 'flash');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => el.classList.remove('flash'), 1700);
        break;
      }
    }
  });
}

/* =========================================================
   内容区点击（展开词条 / 打开搜索结果）
   ========================================================= */
content.addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (item) { item.classList.toggle('open'); return; }

  const result = e.target.closest('.result');
  if (result) {
    clearSearch();
    goto(result.dataset.board, result.dataset.key);
  }
});

/* =========================================================
   搜索
   ========================================================= */
function clearSearch() {
  if (searchInput.value) {
    searchInput.value = '';
    clearBtn.hidden = true;
  }
}

function doSearch(rawKw) {
  const kw = rawKw.trim();
  if (!kw) {
    renderBoard(getBoard(currentBoardId));
    return;
  }

  const lower = kw.toLowerCase();
  const results = INDEX.filter(x =>
    (x.item.name + x.item.desc + x.path).toLowerCase().includes(lower)
  );

  document.documentElement.style.setProperty('--accent', '#14b8a6');

  let html = `
    <div class="board-head">
      <h2><span>🔍</span>搜索「${esc(kw)}」</h2>
      <p>共找到 <strong>${results.length}</strong> 条相关词条</p>
    </div>
  `;

  if (!results.length) {
    html += `
      <div class="empty">
        <div class="big">🫧</div>
        <p>没有找到相关词条。<br>换个关键词试试，比如「三方协议」「租房」「社保」。</p>
      </div>
    `;
  } else {
    html += `<div class="result-list">`;
    results.forEach(r => {
      html += `
        <div class="result" data-board="${r.boardId}" data-key="${esc(r.key)}">
          <div class="result-path">${esc(r.path)}</div>
          <div class="result-name">${hl(r.item.name, kw)}</div>
          <div class="result-desc">${hl(r.item.desc, kw)}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  content.scrollTop = 0;
}

let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearBtn.hidden = !searchInput.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(searchInput.value), 140);
});

clearBtn.addEventListener('click', () => {
  clearSearch();
  doSearch('');
  searchInput.focus();
});

/* 快捷键：/ 聚焦搜索，Esc 清空 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    clearSearch();
    doSearch('');
    searchInput.blur();
  }
});

/* =========================================================
   随机词条
   ========================================================= */
randomBtn.addEventListener('click', () => {
  const r = INDEX[Math.floor(Math.random() * INDEX.length)];
  clearSearch();
  goto(r.boardId, r.key);
});

/* =========================================================
   初始化
   ========================================================= */
renderNav();
renderBoard(getBoard(currentBoardId));
</script>
</body>
</html>
